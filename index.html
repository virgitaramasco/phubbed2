<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Phubbed Studio</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  @font-face {
    font-family: 'helvetica-w01-roman';
    font-style: normal;
    font-weight: 400;
    src: url('https://static.parastorage.com/fonts/v2/2af1bf48-e783-4da8-9fa0-599dde29f2d5/v1/helvetica-w01-roman.woff2') format('woff2');
    font-display: swap;
  }
  @font-face {
    font-family: 'helvetica-w01-bold';
    font-style: normal;
    font-weight: 700;
    src: url('https://static.parastorage.com/fonts/v2/2af1bf48-e783-4da8-9fa0-599dde29f2d5/v1/helvetica-w01-bold.woff2') format('woff2');
    font-display: swap;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: 'helvetica-w01-roman', Helvetica, Arial, sans-serif;
    color: #000000;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Motel Milano Minimal Header */
  .motel-header-bar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    padding: 16px 26px;
    box-sizing: border-box;
    z-index: 99999;
    pointer-events: none;
  }
  .motel-menu-comp {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background-color: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 0, 0, 0.12);
    border-radius: 4px;
    padding: 7px 14px;
    pointer-events: auto;
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }
  .motel-menu-comp:hover {
    background-color: rgba(245, 245, 245, 0.95);
    border-color: rgba(0, 0, 0, 0.22);
  }
  .motel-logo-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #000000;
  }
  .motel-logo-icon {
    width: 20px;
    height: auto;
    display: block;
    object-fit: contain;
    filter: invert(1);
  }
  .motel-brand-title {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: #000000;
    margin: 0;
  }
  .motel-brand-title strong {
    font-family: 'helvetica-w01-bold', Helvetica, Arial, sans-serif;
    font-weight: 700;
  }
  .motel-divider {
    color: rgba(0, 0, 0, 0.3);
    font-size: 11px;
    font-weight: 700;
    margin: 0 1px;
    user-select: none;
  }
  .motel-nav-links {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .motel-nav-link {
    font-size: 11px;
    font-family: 'helvetica-w01-bold', Helvetica, Arial, sans-serif;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #000000;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }
  .motel-nav-link:hover {
    opacity: 0.5;
  }

  /* Stage & Wheel */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    touch-action: pan-y pinch-zoom;
    cursor: grab;
  }
  .stage:active {
    cursor: grabbing;
  }

  /* Central Statement - Exact Typography as Portfolio Page */
  .center-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 680px;
    text-align: center;
    z-index: 5;
    pointer-events: none;
    user-select: none;
  }
  .center-sub {
    font-family: 'helvetica-w01-roman', Helvetica, Arial, sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: normal;
    text-transform: uppercase;
    color: #000000;
    margin-bottom: 16px;
    line-height: 1.4;
    text-align: center;
  }
  .center-main {
    font-family: 'helvetica-w01-bold', Helvetica, Arial, sans-serif;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: -0.19px;
    text-transform: uppercase;
    color: #000000;
    text-align: center;
  }

  /* Orbit Wheel */
  .orbit-container {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    z-index: 10;
  }

  /* Cards - Sharp corners: NO border radius */
  .wheel-card {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--card-w, 68px);
    aspect-ratio: 4 / 5;
    border-radius: 0 !important;
    overflow: visible;
    background-color: #f0f0f0;
    cursor: pointer;
    text-decoration: none;
    pointer-events: auto;
    will-change: transform, opacity;
  }

  .wheel-card-inner {
    width: 100%;
    height: 100%;
    border-radius: 0 !important;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
  }

  .wheel-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 0 !important;
    pointer-events: none;
  }

  .wheel-card:hover .wheel-card-inner {
    transform: scale(1.15);
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.22);
  }

  .card-tooltip {
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 9.5px;
    font-family: 'helvetica-w01-bold', Helvetica, Arial, sans-serif;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #000000;
    background: rgba(255, 255, 255, 0.95);
    padding: 2px 6px;
    border-radius: 2px;
    border: 1px solid rgba(0, 0, 0, 0.12);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .wheel-card:hover .card-tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(3px);
  }

  /* Motel Milano Minimal Footer */
  .motel-minimal-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100vw;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 26px 20px;
    box-sizing: border-box;
    z-index: 99990;
    pointer-events: none;
    font-family: 'helvetica-w01-roman', Helvetica, Arial, sans-serif;
  }
  .motel-footer-mail {
    pointer-events: auto;
    font-size: 11px;
    font-family: 'helvetica-w01-bold', Helvetica, Arial, sans-serif;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #000000;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }
  .motel-footer-mail:hover {
    opacity: 0.55;
  }
  .motel-footer-copy {
    pointer-events: auto;
    font-size: 11px;
    font-family: 'helvetica-w01-bold', Helvetica, Arial, sans-serif;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #000000;
    user-select: none;
  }

  /* Responsive Adjustments */
  @media screen and (max-width: 1000px) {
    .motel-header-bar {
      padding: 12px 16px;
    }
    .motel-brand-title {
      display: none !important;
    }
    .motel-menu-comp {
      display: inline-flex;
      width: auto;
      padding: 7px 12px;
      gap: 10px;
    }
    .motel-minimal-footer {
      padding: 12px 16px 16px;
    }
  }

  @media screen and (max-width: 768px) {
    :root {
      --card-w: 46px;
    }
    .center-text {
      width: 75%;
      max-width: 240px;
    }
    .center-sub {
      font-size: clamp(9px, 2.6vw, 10.5px);
      margin-bottom: 10px;
    }
    .center-main {
      font-size: clamp(14px, 4.2vw, 17px);
      line-height: 1.3;
    }
    .motel-minimal-footer {
      display: none !important;
    }
  }

  @media screen and (max-width: 420px) {
    :root {
      --card-w: 42px;
    }
    .center-text {
      width: 68%;
      max-width: 210px;
    }
    .center-sub {
      font-size: 8.5px;
      margin-bottom: 6px;
    }
    .center-main {
      font-size: 12.5px;
      line-height: 1.22;
    }
  }
</style>
</head>
<body>

<!-- MOTEL MILANO MINIMAL HEADER -->
<div class="motel-header-bar" id="phubbed-motel-header">
    <div class="motel-menu-comp">
        <a href="index.html" class="motel-logo-wrap" title="Phubbed Studio - Home">
            <img src="./HOME _ Phubbed Studio_files/Pink Poppy Flowers.png" alt="Phubbed Logo" class="motel-logo-icon" />
            <span class="motel-brand-title"><strong>Phubbed</strong>Studio</span>
        </a>
        <span class="motel-divider">||</span>
        <div class="motel-nav-links">
            <a href="portfolio.html" class="motel-nav-link" id="nav-portfolio-link">PORTFOLIO</a>
            <a href="CONTACT _ Phubbed Studio.html" class="motel-nav-link" id="nav-contact-link">CONTACT</a>
        </div>
    </div>
</div>

<div class="stage" id="stage">
  <!-- Central Statement (Exact as Portfolio page) -->
  <div class="center-text" id="centerText">
    <div class="center-sub">where ideas take shape and brands find clarity.</div>
    <div class="center-main">We create meaningful connections through strategy, content, and identity.</div>
  </div>

  <!-- Orbit container -->
  <div class="orbit-container" id="orbitContainer"></div>
</div>

<!-- MOTEL MILANO MINIMAL FOOTER -->
<div class="motel-minimal-footer" id="phubbed-motel-footer">
    <a href="mailto:phubbed.studio@gmail.com" class="motel-footer-mail">phubbed.studio@gmail.com</a>
    <div class="motel-footer-center"></div>
    <div class="motel-footer-copy">&copy;2026 PHUBBED STUDIO&trade;</div>
</div>

<script>
const projects = [
  { href: "agme.html", num: "001", title: "AGME Milano", img: "brand_identity_web/agme/3 copia 2.webp" },
  { href: "armonia.html", num: "002", title: "Armonia", img: "social_graphic_web/armonia_teaser_poster.webp" },
  { href: "carrie_on.html", num: "003", title: "Carrie On", img: "popup_web/carrie on/CARRIEON.webp" },
  { href: "club_giovanile.html", num: "004", title: "Club Giovanile", img: "foto_video_web/CLUB GIOVANILE/01 COVER - CLUB GIOVANILE.webp" },
  { href: "confine.html", num: "005", title: "Confine", img: "brand_identity_web/confine/CONFINE.webp" },
  { href: "dv_society.html", num: "006", title: "DV Society", img: "brand_identity_web/dv society/4d2d14_2a2f35fd4ddf4538a2abc7b4736864ab~mv2.webp" },
  { href: "follonica_masters_arena.html", num: "007", title: "Follonica Masters Arena", img: "brand_identity_web/follonica masters arena/25 copia.webp" },
  { href: "inner_circle.html", num: "008", title: "Inner Circle", img: "brand_identity_web/inner circle/25.09 copia.webp" },
  { href: "kis.html", num: "009", title: "Kis", img: "brand_identity_web/kis/3.webp" },
  { href: "mantra_vibes.html", num: "010", title: "Mantra Vibes", img: "brand_identity_web/mantra vibes/22 copia.webp" },
  { href: "niio.html", num: "011", title: "Niio", img: "brand_identity_web/niio/1709.webp" },
  { href: "panarea.html", num: "012", title: "Panarea", img: "brand_identity_web/panarea/1.webp" },
  { href: "patrizia_e_teresa.html", num: "013", title: "Patrizia e Teresa", img: "brand_identity_web/patrizia e teresa/post5.webp" },
  { href: "period_agency.html", num: "014", title: "Period Agency", img: "social_graphic_web/period_motion_poster.webp" },
  { href: "sand2sand.html", num: "015", title: "Sand2Sand", img: "brand_identity_web/sand2sand/lineups2sfinal_comp_poster.webp" },
  { href: "tredici_gaeta.html", num: "016", title: "Tredici Gaeta", img: "brand_identity_web/tredici_gaeta/fish_and_chips.webp" },
  { href: "tursport.html", num: "017", title: "Tursport", img: "brand_identity_web/tursport/COVER.webp" },
  { href: "tutto_finto.html", num: "018", title: "Tuttofinto", img: "brand_identity_web/tutto finto/24652dc92e6cd179416d098b6865d460.webp" },
  { href: "vertigine.html", num: "019", title: "Vertigine", img: "brand_identity_web/vertigine/vertigine.webp" },
  { href: "soulstice.html", num: "020", title: "Soulstice", img: "brand_identity_web/soulstice/cover.webp" }
];

const total = projects.length; // 20 projects
const container = document.getElementById('orbitContainer');
const stage = document.getElementById('stage');
const cardEls = [];

let hasDragged = false;
let isPointerDown = false;
let pointerStartX = 0;
let pointerStartY = 0;

// Create card elements
projects.forEach((p, i) => {
  const a = document.createElement('a');
  a.className = 'wheel-card';
  a.href = p.href;
  a.title = p.title;
  a.innerHTML = `
    <div class="wheel-card-inner">
      <img src="${p.img}" alt="${p.title}" />
    </div>
    <span class="card-tooltip">${p.num} ${p.title}</span>
  `;
  
  // Prevent accidental click during drag
  a.addEventListener('click', (e) => {
    if (hasDragged) {
      e.preventDefault();
      e.stopPropagation();
    }
  });

  container.appendChild(a);
  cardEls.push(a);
});

let startTime = null;

// Slower, more elegant animation timing
const durationEntrance = 2200;    // Slower horizontal line entrance
const durationOpenCircle = 2000;  // Slower transition into circle
const startX = 850;
const spaceBetweenRow = 72;

let rotationAngle = 0;
let targetVelocity = 0;
let currentVelocity = 0;
const autoSpeed = 0.00065; // Slower, graceful continuous rotation

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

function getRadius() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  if (w <= 420) {
    return Math.min(w * 0.43, h * 0.38, 165);
  }
  if (w <= 768) {
    return Math.min(w * 0.44, h * 0.38, 185);
  }
  return Math.min(w * 0.40, h * 0.42, 385);
}

// Slower, smoother wheel rotation on scroll
window.addEventListener('wheel', (e) => {
  targetVelocity += e.deltaY * 0.00016;
}, { passive: true });

// Touch Drag Support (mobile/tablets)
let touchStartY = 0;
let touchStartX = 0;

window.addEventListener('touchstart', (e) => {
  hasDragged = false;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener('touchmove', (e) => {
  const touchX = e.touches[0].clientX;
  const touchY = e.touches[0].clientY;
  const deltaY = touchStartY - touchY;
  const deltaX = touchStartX - touchX;
  
  if (Math.abs(deltaY) > 5 || Math.abs(deltaX) > 5) {
    hasDragged = true;
  }
  
  touchStartY = touchY;
  touchStartX = touchX;
  targetVelocity += (deltaY * 0.00028) + (deltaX * 0.0002);
}, { passive: true });

// Desktop Mouse / Pointer Drag Support
window.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  isPointerDown = true;
  hasDragged = false;
  pointerStartX = e.clientX;
  pointerStartY = e.clientY;
});

window.addEventListener('mousemove', (e) => {
  if (!isPointerDown) return;
  const deltaX = pointerStartX - e.clientX;
  const deltaY = pointerStartY - e.clientY;
  if (Math.abs(deltaX) > 4 || Math.abs(deltaY) > 4) {
    hasDragged = true;
  }
  pointerStartX = e.clientX;
  pointerStartY = e.clientY;
  targetVelocity += (deltaY * 0.00022) + (deltaX * 0.00015);
});

window.addEventListener('mouseup', () => {
  isPointerDown = false;
  setTimeout(() => { hasDragged = false; }, 80);
});

function tick(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = timestamp - startTime;
  const radius = getRadius();

  // Smooth momentum & continuous rotation
  currentVelocity += (targetVelocity - currentVelocity) * 0.08;
  targetVelocity *= 0.90;
  rotationAngle += autoSpeed + currentVelocity;

  const circleStartTime = durationEntrance + 400;

  cardEls.forEach((card, i) => {
    const centerOffsetX = (i - (total - 1) / 2) * spaceBetweenRow;
    let posX = startX;
    let posY = 0;
    let opacity = 0;

    if (elapsed <= circleStartTime) {
      // Phase 1: Enter from right into a neat horizontal line (slower, staggered)
      const delay = i * 45;
      if (elapsed > delay) {
        const progress = easeOutCubic(Math.min((elapsed - delay) / durationEntrance, 1));
        posX = startX + (centerOffsetX - startX) * progress;
        opacity = progress;
      }
    } else {
      // Phase 2: Unfold smoothly into circular orbit
      const openProgress = easeOutCubic(Math.min((elapsed - circleStartTime) / durationOpenCircle, 1));
      const baseAngle = (i / total) * Math.PI * 2 - Math.PI / 2;
      const angle = baseAngle + rotationAngle;

      const circleX = Math.cos(angle) * radius;
      const circleY = Math.sin(angle) * radius;

      posX = centerOffsetX + (circleX - centerOffsetX) * openProgress;
      posY = circleY * openProgress;
      opacity = 1;
    }

    card.style.opacity = opacity;
    card.style.transform = `translate3d(calc(-50% + ${posX}px), calc(-50% + ${posY}px), 0)`;
  });

  requestAnimationFrame(tick);
}

requestAnimationFrame(tick);
</script>
</body>
</html>
